[project]
name = "django-experiment-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.rst"
authors = [
    { name = "Taos Transue", email = "spacechips@rocketmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_experiment_tracker"]
